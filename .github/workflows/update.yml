name: Cập nhật kết quả Vietlott
on:
  schedule:
    - cron: '*/15 11-12 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: update-results
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python update_results.py
      - name: Commit nếu có kết quả mới
        run: |
          git config user.name "vietlott-bot"
          git config user.email "bot@users.noreply.github.com"
          git add results.json
          git diff --cached --quiet || (git commit -m "Cập nhật kết quả Vietlott" && git push)
